<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmberWatch: fire detections, screened</title>

  <!-- Helix UI fonts (Fontshare). Falls back to system fonts if offline. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@500,600&f[]=satoshi@400,500,700&display=swap">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>EmberWatch</h1>
  </div>
</header>

<div id="status" class="status" role="status" hidden></div>

<section class="controls" aria-label="Screening controls">
  <div class="mode-bar">
    <div class="seg" role="group" aria-label="Screening mode">
      <span class="seg-label">Mode</span>
      <button type="button" id="btn-mode-region" class="mode-btn" aria-pressed="true">Region</button>
      <button type="button" id="btn-mode-proximity" class="mode-btn" aria-pressed="false">Proximity Check</button>
    </div>
  </div>

  <div id="region-controls" class="mode-group">
    <label class="field">
      <span>Country</span>
      <select id="sel-country" disabled><option>Loading…</option></select>
    </label>
    <label class="field">
      <span>State or province</span>
      <select id="sel-state" disabled><option>Choose a country first</option></select>
    </label>
  </div>

  <div id="proximity-controls" class="mode-group" hidden>
    <div class="seg" role="group" aria-label="Proximity type">
      <span class="seg-label">Target</span>
      <button type="button" id="btn-submode-point" aria-pressed="true">Point radius</button>
      <button type="button" id="btn-submode-route" aria-pressed="false">Route corridor</button>
    </div>

    <label class="field">
      <span id="label-buffer">Radius</span>
      <select id="sel-buffer">
        <option value="10">10 km</option>
        <option value="25" selected>25 km</option>
        <option value="50">50 km</option>
      </select>
    </label>

    <div class="field search-field">
      <span>Find place (OSM)</span>
      <div class="search-wrap">
        <input type="text" id="input-place-search" placeholder="e.g. Nagpur or Bhopal" autocomplete="off">
        <button type="button" id="btn-place-search" class="btn-action">Search</button>
      </div>
    </div>

    <div class="action-buttons">
      <button type="button" id="btn-snap-road" class="btn-action snap-btn" hidden title="Snap route to highways via OSRM">Snap to road</button>
      <button type="button" id="btn-clear-proximity" class="btn-action secondary">Clear</button>
    </div>
  </div>

  <p class="selection" id="selection-readout" aria-live="polite"></p>
</section>

<main class="grid">
  <section class="panel map-panel" aria-label="Map of fire detections">
    <div id="map" role="img" aria-label="Map of fire detections on a 0.25 degree grid"></div>
    <div class="map-legend" id="map-legend"></div>
  </section>

  <aside class="panel summary-panel" id="summary-panel" aria-label="Summary">
    <h2>Summary</h2>
    <div id="summary-body"><p class="muted">Pending piece 5.</p></div>
  </aside>

  <section class="panel table-panel" aria-label="Priority table">
    <h2 id="table-title">Priority table</h2>
    <div id="table-body"><p class="muted">Pending piece 3.</p></div>
  </section>

  <section class="panel chart-panel" aria-label="Daily fire detections">
    <h2>Daily fire detections</h2>
    <div id="chart-body"><p class="muted">Pending piece 4.</p></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
<script src="proximity.js"></script>
</body>
</html>
